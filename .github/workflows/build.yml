name: build

# Builds and tests StreamCopy on Windows and Linux for every push to main and every pull request, and keeps the
# binaries as downloadable artifacts of the run (Actions tab → the run → Artifacts). Not code-signed.
# Linux: a static x86_64 binary (musl), so it runs on any distribution without depending on its glibc.
# A pushed tag vX.Y.Z also builds the release zip and creates a DRAFT release with it (notes from
# docs/releases/vX.Y.Z.md); a draft is not public until it is published by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Build scopy.exe and scopyw.exe
        shell: pwsh
        run: |
          # No build machine paths in the exes: remap them, and keep only the PDB's file name.
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=src --remap-path-prefix=$env:USERPROFILE\.cargo=cargo --remap-path-prefix=$env:USERPROFILE\.rustup=rustup -C link-arg=/PDBALTPATH:%_PDB%"
          cargo build --release --features gui
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $name = "StreamCopy-$env:version-windows-x64"
          New-Item -ItemType Directory dist\$name | Out-Null
          Copy-Item target\release\scopy.exe, target\release\scopyw.exe, README.md, LICENSE.md dist\$name
          Copy-Item docs\QUICKSTART.txt dist\$name
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip
          Copy-Item target\release\scopy.exe, target\release\scopyw.exe dist
          Get-FileHash dist\scopy.exe, dist\scopyw.exe, dist\$name.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          "package=$name" >> $env:GITHUB_ENV

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package }}
          path: |
            dist/${{ env.package }}.zip
            dist/scopy.exe
            dist/scopyw.exe
            dist/SHA256SUMS.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Tests
        run: cargo test --release

      - name: Build static scopy
        run: |
          # No build machine paths in the binary.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=src --remap-path-prefix=$HOME/.cargo=cargo --remap-path-prefix=$HOME/.rustup=rustup"
          cargo build --release --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/scopy
          file target/x86_64-unknown-linux-musl/release/scopy
          echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Package
        run: |
          name="StreamCopy-$version-linux-x64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/scopy README.md LICENSE.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz"
          echo "package=$name" >> "$GITHUB_ENV"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package }}
          path: dist/${{ env.package }}.tar.gz

  draft-release:
    # Only for tags: the release is created as a draft, checked, and published by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version must match the tag
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Cargo.toml says $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "no docs/releases/$GITHUB_REF_NAME.md"; exit 1; }

      - name: SHA-256 of every release file
        run: cd dist && rm -f SHA256SUMS.txt && sha256sum *.zip *.tar.gz scopy.exe scopyw.exe | tee SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/scopy.exe dist/scopyw.exe dist/SHA256SUMS.txt \
            --draft --verify-tag --title "StreamCopy ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
