[package]
name = "scopy"
version = "0.26.1"
edition = "2021"
description = "StreamCopy: fast copying of many small files over the network"
authors = ["fsaritome"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/fsaritome/StreamCopy"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
getrandom = "0.2"
socket2 = "0.5"
# TLS 1.3 with the ring provider (no CMake/NASM needed on Windows, unlike aws-lc-rs); rcgen for the ephemeral key.
notify = "6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
# The tray app (scopyw.exe, --features gui) only.
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "0.26", optional = true }
winreg = "0.52"
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# syncfs(2): one flush of the target file system instead of one fsync per file (no special rights needed).
libc = "0.2"

[target.'cfg(target_env = "musl")'.dependencies]
# The static Linux build: musl's own allocator made scopy twice as slow (many threads); mimalloc instead.
mimalloc = { version = "0.1", default-features = false }

[features]
# Escape hatch for machines that misbehave with SIMD: plain portable hashing code paths.
# zstd only uses baseline instructions plus its own runtime-detected BMI2 paths.
portable = ["blake3/pure"]
# Test tools in the binary (hidden `test-relay`: TLS man-in-the-middle check). Never for release builds.
testtools = []
# The tray app scopyw.exe (Windows): cargo build --release --features gui
gui = ["dep:eframe", "dep:tray-icon"]

[[bin]]
name = "scopy"
path = "src/main.rs"

[[bin]]
name = "scopyw"
path = "src/bin/scopyw.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
